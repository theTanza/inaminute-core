[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inaminute-core"
version = "0.1.0"
description = "Deterministic, explainable schedule generation without institutional data or service dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "InAMinute maintainers" }]
keywords = ["scheduling", "timetabling", "constraint-satisfaction", "education"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Education",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pip-audit>=2.9.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
  "twine>=6.1",
]

[project.scripts]
inaminute-demo = "inaminute_core.demo:main"

[project.urls]
Homepage = "https://github.com/theTanza/inaminute-core"
Documentation = "https://github.com/theTanza/inaminute-core#readme"
Issues = "https://github.com/theTanza/inaminute-core/issues"
Source = "https://github.com/theTanza/inaminute-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inaminute_core = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inaminute_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
