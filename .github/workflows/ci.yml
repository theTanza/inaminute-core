name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Enforce public-repository boundary
        run: python scripts/privacy_guard.py
      - name: Lint
        run: ruff check .
      - name: Test with branch coverage
        run: pytest --cov --cov-report=term-missing

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging and audit tools
        run: python -m pip install --upgrade pip build twine pip-audit
      - name: Audit declared dependencies
        run: pip-audit --strict .
      - name: Build distributions
        run: python -m build
      - name: Verify distribution metadata
        run: twine check dist/*
